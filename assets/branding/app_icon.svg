<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ambient background glow: dark base with indigo/violet bloom -->
    <radialGradient id="bg" cx="50%" cy="62%" r="75%">
      <stop offset="0%"  stop-color="#241a4d"/>
      <stop offset="42%" stop-color="#12122a"/>
      <stop offset="100%" stop-color="#05060A"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="88%" r="55%">
      <stop offset="0%"  stop-color="#38E1FF" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#1E6E8C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1E6E8C" stop-opacity="0"/>
    </radialGradient>

    <!-- Couch glass gradient -->
    <linearGradient id="couch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#7B8AF0"/>
      <stop offset="100%" stop-color="#4750A8"/>
    </linearGradient>
    <linearGradient id="couchDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#5A62BE"/>
      <stop offset="100%" stop-color="#343A78"/>
    </linearGradient>

    <!-- Roach body -->
    <radialGradient id="body" cx="42%" cy="32%" r="80%">
      <stop offset="0%"  stop-color="#B5713F"/>
      <stop offset="55%" stop-color="#8A4F28"/>
      <stop offset="100%" stop-color="#5E3418"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#9A5A30"/>
      <stop offset="100%" stop-color="#6B3C1D"/>
    </linearGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="legShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded-square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#cyanGlow)"/>

  <!-- ===================== COUCH ===================== -->
  <g>
    <!-- backrest -->
    <rect x="150" y="470" width="724" height="230" rx="70" fill="url(#couchDark)"/>
    <!-- back cushions -->
    <rect x="315" y="500" width="180" height="180" rx="46" fill="url(#couch)" opacity="0.9"/>
    <rect x="530" y="500" width="180" height="180" rx="46" fill="url(#couch)" opacity="0.9"/>
    <!-- seat base -->
    <rect x="170" y="650" width="684" height="180" rx="56" fill="url(#couchDark)"/>
    <!-- seat cushion -->
    <rect x="230" y="640" width="564" height="120" rx="46" fill="url(#couch)"/>
    <!-- arms -->
    <rect x="128" y="560" width="120" height="290" rx="56" fill="url(#couch)"/>
    <rect x="776" y="560" width="120" height="290" rx="56" fill="url(#couch)"/>
    <!-- glass highlight on arms -->
    <rect x="150" y="576" width="34" height="150" rx="17" fill="#FFFFFF" opacity="0.18"/>
    <rect x="798" y="576" width="34" height="150" rx="17" fill="#FFFFFF" opacity="0.18"/>
  </g>

  <!-- ===================== ROACH ===================== -->
  <g filter="url(#legShadow)">
    <!-- back legs -->
    <g stroke="#43230F" stroke-width="20" stroke-linecap="round" fill="none">
      <path d="M430 610 q-70 30 -120 8"/>
      <path d="M450 640 q-80 44 -150 40"/>
      <path d="M600 640 q80 44 150 40"/>
      <path d="M590 610 q70 30 120 8"/>
    </g>

    <!-- antennae -->
    <g stroke="#5E3418" stroke-width="15" stroke-linecap="round" fill="none">
      <path d="M452 452 q-70 -120 -150 -150"/>
      <path d="M560 452 q60 -130 150 -175"/>
    </g>

    <!-- body (reclining oval) -->
    <ellipse cx="512" cy="560" rx="180" ry="150" fill="url(#body)"/>
    <!-- shell wing split -->
    <path d="M512 420 q120 60 96 250 q-96 40 -192 0 q-24 -190 96 -250 z" fill="url(#shell)" opacity="0.55"/>
    <line x1="512" y1="430" x2="512" y2="690" stroke="#3F2411" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
    <!-- glossy highlight -->
    <ellipse cx="452" cy="490" rx="70" ry="46" fill="#FFFFFF" opacity="0.16"/>

    <!-- head -->
    <ellipse cx="512" cy="452" rx="96" ry="80" fill="url(#body)"/>
    <!-- eyes -->
    <circle cx="472" cy="440" r="30" fill="#F3F5FF"/>
    <circle cx="552" cy="440" r="30" fill="#F3F5FF"/>
    <circle cx="478" cy="446" r="15" fill="#0A0B14"/>
    <circle cx="558" cy="446" r="15" fill="#0A0B14"/>
    <circle cx="484" cy="440" r="5" fill="#FFFFFF"/>
    <circle cx="564" cy="440" r="5" fill="#FFFFFF"/>
    <!-- little smile -->
    <path d="M486 486 q26 26 52 0" stroke="#3F2411" stroke-width="9" stroke-linecap="round" fill="none"/>

    <!-- front arm holding remote -->
    <path d="M620 560 q90 -6 132 -70" stroke="#5E3418" stroke-width="22" stroke-linecap="round" fill="none"/>
  </g>

  <!-- TV remote (cyan, glowing) -->
  <g transform="rotate(-24 770 470)">
    <rect x="726" y="420" width="88" height="150" rx="26" fill="#0B0D15" stroke="#38E1FF" stroke-width="7"/>
    <circle cx="770" cy="452" r="13" fill="#38E1FF"/>
    <rect x="752" y="486" width="36" height="12" rx="6" fill="#38E1FF" opacity="0.85"/>
    <rect x="752" y="510" width="36" height="12" rx="6" fill="#6C7DFF" opacity="0.85"/>
    <rect x="752" y="534" width="36" height="12" rx="6" fill="#6C7DFF" opacity="0.6"/>
  </g>
</svg>
