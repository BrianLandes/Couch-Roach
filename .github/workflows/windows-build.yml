name: Windows build

# Manual trigger only — Actions tab → "Windows build" → Run workflow.
# No push/PR triggers on purpose; this is a build-on-demand pipeline for now.
on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        type: choice
        default: release
        options:
          - release
          - profile
          - debug

env:
  FLUTTER_VERSION: "3.44.5"

jobs:
  build:
    runs-on: windows-latest # VS 2022 + MSVC C++ toolchain preinstalled

    # Needed so the Publish Release step can create tags/releases with the
    # auto-provided GITHUB_TOKEN (no PAT required to *publish* — the launcher
    # only needs a read-only PAT to *download*).
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      # dart_define.json is git-crypt-encrypted in the repo, so CI can't read it.
      # Reconstruct it from repository secrets instead of unlocking git-crypt.
      # Add these under Settings → Secrets and variables → Actions:
      #   TMDB_API_KEY, OPENSUBTITLES_API_KEY
      - name: Write dart_define.json from secrets
        shell: bash
        run: |
          cat > dart_define.json <<EOF
          {
            "TMDB_API_KEY": "${{ secrets.TMDB_API_KEY }}",
            "OPENSUBTITLES_API_KEY": "${{ secrets.OPENSUBTITLES_API_KEY }}"
          }
          EOF

      # Fetch + extract the qBittorrent daemon binary into third_party/ so the
      # CMake install rule bundles it next to the app exe (7-Zip is preinstalled
      # on windows-latest). No official headless nox.exe exists for Windows, so
      # this extracts the GUI qbittorrent.exe from the official signed installer;
      # the app runs it hidden via its WebUI. See tool/fetch_qbittorrent_windows.ps1.
      - name: Vendor qBittorrent daemon
        shell: pwsh
        run: ./tool/fetch_qbittorrent_windows.ps1

      # yt-dlp lets libmpv resolve YouTube trailers; ffprobe is the fast
      # subtitle-stream probe. Both are extracted into third_party/ so the CMake
      # install rules bundle them next to the app exe. See tool/fetch_*_windows.ps1.
      - name: Vendor yt-dlp
        shell: pwsh
        run: ./tool/fetch_ytdlp_windows.ps1

      - name: Vendor ffprobe
        shell: pwsh
        run: ./tool/fetch_ffprobe_windows.ps1

      # Jackett indexer sidecar (self-contained .NET tree) — extracted into
      # third_party/ so the CMake rule bundles it as jackett/ next to the app exe.
      # See tool/fetch_jackett_windows.ps1.
      - name: Vendor Jackett
        shell: pwsh
        run: ./tool/fetch_jackett_windows.ps1

      - name: Build Windows (${{ inputs.build_mode }})
        run: flutter build windows --${{ inputs.build_mode }} --dart-define-from-file=dart_define.json

      # The .exe won't run on its own — it needs the sibling DLLs and data\
      # folder. Drop a manifest.json the launcher reads to compare builds, then
      # zip the whole Release dir so both the artifact and the release asset are
      # a runnable bundle.
      - name: Package build output
        shell: bash
        run: |
          OUT_DIR="build/windows/x64/runner/${{ inputs.build_mode == 'release' && 'Release' || inputs.build_mode == 'profile' && 'Profile' || 'Debug' }}"
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Packaging $OUT_DIR (version $VERSION, build ${{ github.run_number }})"
          ls -la "$OUT_DIR"

          # `build` is monotonic (github.run_number), so the launcher can compare
          # it against the installed build without the pubspec version being
          # hand-bumped every time.
          cat > "$OUT_DIR/manifest.json" <<EOF
          {
            "build": ${{ github.run_number }},
            "version": "$VERSION",
            "mode": "${{ inputs.build_mode }}",
            "commit": "${{ github.sha }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Zip the runnable bundle
        shell: pwsh
        run: |
          $zip = "couch-roach-windows-${{ inputs.build_mode }}-build${{ github.run_number }}.zip"
          Compress-Archive -Path "$env:OUT_DIR/*" -DestinationPath $zip -Force
          "ZIP_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: couch-roach-windows-${{ inputs.build_mode }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

      # Assemble the vendored sidecars (populated by the Vendor steps above) into
      # a flat bin layout — qbittorrent.exe, yt-dlp.exe, ffprobe.exe, jackett/ —
      # and publish them as a separate release asset the launcher provisions into
      # %LOCALAPPDATA%\CouchRoach\bin. They're no longer bundled into the app zip
      # (see windows/CMakeLists.txt). The content-hash tag in the filename stays
      # stable while the sidecars don't change, so the launcher only re-downloads
      # them on a real version bump — not on every app update.
      - name: Package sidecars
        if: ${{ inputs.build_mode == 'release' }}
        shell: pwsh
        run: |
          $stage = "sidecars_stage"
          New-Item -ItemType Directory -Force -Path $stage, "$stage/jackett" | Out-Null
          Copy-Item third_party/qbittorrent/win-x64/qbittorrent.exe $stage/
          Copy-Item third_party/yt-dlp/win-x64/yt-dlp.exe $stage/
          Copy-Item third_party/ffprobe/win-x64/ffprobe.exe $stage/
          Copy-Item third_party/jackett/win-x64/* "$stage/jackett/" -Recurse -Force
          Copy-Item third_party/qbittorrent/LICENSE-qbittorrent.txt $stage/ -ErrorAction SilentlyContinue
          Copy-Item third_party/yt-dlp/LICENSE-yt-dlp.txt $stage/ -ErrorAction SilentlyContinue
          Copy-Item third_party/ffprobe/LICENSE-ffmpeg.txt $stage/ -ErrorAction SilentlyContinue
          Copy-Item third_party/jackett/LICENSE-jackett.txt $stage/ -ErrorAction SilentlyContinue

          # Content tag: hash the four key binaries so the asset name is stable
          # while the sidecars are unchanged (launcher then skips re-download).
          $parts = @(
            (Get-FileHash "$stage/qbittorrent.exe").Hash,
            (Get-FileHash "$stage/yt-dlp.exe").Hash,
            (Get-FileHash "$stage/ffprobe.exe").Hash,
            (Get-FileHash "$stage/jackett/JackettConsole.exe").Hash
          ) -join ''
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($parts)
          $tag = (($sha.ComputeHash($bytes) | ForEach-Object { $_.ToString('x2') }) -join '').Substring(0, 8)

          $zip = "sidecars-$tag.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          "SIDECARS_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Sidecars asset: $zip"

      # Publish a GitHub Release the launcher polls via /releases/latest. Release
      # builds only — a profile/debug dispatch never becomes an update the
      # launcher would install. The manifest is attached both inside the zip and
      # as its own asset so the launcher can read it without downloading the zip.
      - name: Publish Release
        if: ${{ inputs.build_mode == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Couch Roach build ${{ github.run_number }} (v${{ env.APP_VERSION }})
          make_latest: true
          files: |
            ${{ env.ZIP_PATH }}
            ${{ env.OUT_DIR }}/manifest.json
            ${{ env.SIDECARS_ZIP }}

  # Build the self-updating launcher (couch_roach_launcher.exe). It's a separate,
  # deliberately-dumb package: you install it once and it self-updates the app.
  # Runs in parallel with the app build — no dart_define / sidecars needed.
  launcher:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build launcher (release)
        working-directory: launcher
        run: |
          flutter pub get
          flutter build windows --release

      - name: Zip the launcher bundle
        shell: pwsh
        run: |
          $zip = "couch-roach-launcher-build${{ github.run_number }}.zip"
          Compress-Archive -Path "launcher/build/windows/x64/runner/Release/*" -DestinationPath $zip -Force
          "LAUNCHER_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: couch-roach-launcher
          path: ${{ env.LAUNCHER_ZIP }}
          if-no-files-found: error
