name: Windows build

# Manual trigger only — Actions tab → "Windows build" → Run workflow.
# No push/PR triggers on purpose; this is a build-on-demand pipeline for now.
on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        type: choice
        default: release
        options:
          - release
          - profile
          - debug

env:
  FLUTTER_VERSION: "3.44.5"

jobs:
  build:
    runs-on: windows-latest # VS 2022 + MSVC C++ toolchain preinstalled

    # Needed so the Publish Release step can create tags/releases with the
    # auto-provided GITHUB_TOKEN (no PAT required to *publish* — the launcher
    # only needs a read-only PAT to *download*).
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      # dart_define.json is git-crypt-encrypted in the repo, so CI can't read it.
      # Reconstruct it from repository secrets instead of unlocking git-crypt.
      # Add these under Settings → Secrets and variables → Actions:
      #   TMDB_API_KEY, OPENSUBTITLES_API_KEY
      - name: Write dart_define.json from secrets
        shell: bash
        run: |
          cat > dart_define.json <<EOF
          {
            "TMDB_API_KEY": "${{ secrets.TMDB_API_KEY }}",
            "OPENSUBTITLES_API_KEY": "${{ secrets.OPENSUBTITLES_API_KEY }}"
          }
          EOF

      # NOTE: the sidecars (qBittorrent/yt-dlp/ffprobe/Jackett) are NOT vendored
      # or bundled here anymore — they're built and published separately by the
      # "Launcher & sidecars" workflow, and the launcher provisions them at
      # runtime. This keeps the app build fast (no 100MB ffmpeg download, no
      # installer extraction).
      - name: Build Windows (${{ inputs.build_mode }})
        run: flutter build windows --${{ inputs.build_mode }} --dart-define-from-file=dart_define.json

      # The .exe won't run on its own — it needs the sibling DLLs and data\
      # folder. Drop a manifest.json the launcher reads to compare builds, then
      # zip the whole Release dir so both the artifact and the release asset are
      # a runnable bundle.
      - name: Package build output
        shell: bash
        run: |
          OUT_DIR="build/windows/x64/runner/${{ inputs.build_mode == 'release' && 'Release' || inputs.build_mode == 'profile' && 'Profile' || 'Debug' }}"
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Packaging $OUT_DIR (version $VERSION, build ${{ github.run_number }})"
          ls -la "$OUT_DIR"

          # `build` is monotonic (github.run_number), so the launcher can compare
          # it against the installed build without the pubspec version being
          # hand-bumped every time.
          cat > "$OUT_DIR/manifest.json" <<EOF
          {
            "build": ${{ github.run_number }},
            "version": "$VERSION",
            "mode": "${{ inputs.build_mode }}",
            "commit": "${{ github.sha }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Zip the runnable bundle
        shell: pwsh
        run: |
          $zip = "couch-roach-windows-${{ inputs.build_mode }}-build${{ github.run_number }}.zip"
          Compress-Archive -Path "$env:OUT_DIR/*" -DestinationPath $zip -Force
          "ZIP_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: couch-roach-windows-${{ inputs.build_mode }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

      # Publish a GitHub Release the launcher polls via /releases/latest. Release
      # builds only — a profile/debug dispatch never becomes an update the
      # launcher would install. The manifest is attached both inside the zip and
      # as its own asset so the launcher can read it without downloading the zip.
      # (Sidecars are published separately — see the "Launcher & sidecars"
      # workflow — so they're not rebuilt on every app build.)
      - name: Publish Release
        if: ${{ inputs.build_mode == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Couch Roach build ${{ github.run_number }} (v${{ env.APP_VERSION }})
          make_latest: true
          files: |
            ${{ env.ZIP_PATH }}
            ${{ env.OUT_DIR }}/manifest.json
