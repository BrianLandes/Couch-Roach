name: Windows build

# Two triggers:
#  - push to main → continuous delivery: builds release and publishes a Release
#    with make_latest, which the launcher auto-installs on the TV.
#  - manual (Actions tab → "Windows build" → Run workflow) → pick the build mode;
#    release still publishes, profile/debug just produce an artifact.
# A push carries no `build_mode` input, so everything below reads env.BUILD_MODE,
# which defaults to `release` when the input is absent.
# The keyed exe (TMDB / OpenSubtitles / Alexa keys baked in via --dart-define)
# is published to the PRIVATE couch-roach-dist repo, not this public one — so it
# is never world-downloadable. The public keyed artifact upload was removed for
# the same reason.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        type: choice
        default: release
        options:
          - release
          - profile
          - debug

# Coalesce rapid pushes to main: a newer commit cancels an in-flight build so
# the launcher's "latest" always tracks the newest green commit, not a race.
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.5"

jobs:
  build:
    runs-on: windows-latest # VS 2022 + MSVC C++ toolchain preinstalled

    # This job writes nothing to the public repo — the release goes to
    # couch-roach-dist via the DIST_REPO_TOKEN PAT — so it only needs read.
    permissions:
      contents: read

    # Single source of truth for the build mode. A workflow_dispatch supplies
    # `build_mode`; a push has no inputs, so fall back to `release`.
    env:
      BUILD_MODE: ${{ inputs.build_mode || 'release' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      # dart_define.json is git-crypt-encrypted in the repo, so CI can't read it.
      # Reconstruct it from repository secrets instead of unlocking git-crypt.
      # Add these under Settings → Secrets and variables → Actions:
      #   TMDB_API_KEY, OPENSUBTITLES_API_KEY, ALEXA_INBOX_TOKEN
      # (ALEXA_INBOX_BASE_URL isn't needed — AppConfig defaults it to the public
      # Worker URL; add it here only to point at a different endpoint.)
      - name: Write dart_define.json from secrets
        shell: bash
        run: |
          cat > dart_define.json <<EOF
          {
            "TMDB_API_KEY": "${{ secrets.TMDB_API_KEY }}",
            "OPENSUBTITLES_API_KEY": "${{ secrets.OPENSUBTITLES_API_KEY }}",
            "ALEXA_INBOX_TOKEN": "${{ secrets.ALEXA_INBOX_TOKEN }}"
          }
          EOF

      # NOTE: the sidecars (qBittorrent/yt-dlp/ffprobe/Jackett) are NOT vendored
      # or bundled here anymore — they're built and published separately by the
      # "Launcher & sidecars" workflow, and the launcher provisions them at
      # runtime. This keeps the app build fast (no 100MB ffmpeg download, no
      # installer extraction).
      - name: Build Windows (${{ env.BUILD_MODE }})
        run: flutter build windows --${{ env.BUILD_MODE }} --dart-define-from-file=dart_define.json

      # The .exe won't run on its own — it needs the sibling DLLs and data\
      # folder. Drop a manifest.json the launcher reads to compare builds, then
      # zip the whole Release dir so both the artifact and the release asset are
      # a runnable bundle.
      - name: Package build output
        shell: bash
        run: |
          OUT_DIR="build/windows/x64/runner/${{ env.BUILD_MODE == 'release' && 'Release' || env.BUILD_MODE == 'profile' && 'Profile' || 'Debug' }}"
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Packaging $OUT_DIR (version $VERSION, build ${{ github.run_number }})"
          ls -la "$OUT_DIR"

          # `build` is monotonic (github.run_number), so the launcher can compare
          # it against the installed build without the pubspec version being
          # hand-bumped every time.
          cat > "$OUT_DIR/manifest.json" <<EOF
          {
            "build": ${{ github.run_number }},
            "version": "$VERSION",
            "mode": "${{ env.BUILD_MODE }}",
            "commit": "${{ github.sha }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Zip the runnable bundle
        shell: pwsh
        run: |
          $zip = "couch-roach-windows-${{ env.BUILD_MODE }}-build${{ github.run_number }}.zip"
          Compress-Archive -Path "$env:OUT_DIR/*" -DestinationPath $zip -Force
          "ZIP_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      # NO public artifact upload: the zip carries baked-in API keys, and
      # artifacts on a public repo are world-downloadable. The build is published
      # only to the private couch-roach-dist repo below.

      # Publish a GitHub Release to the PRIVATE couch-roach-dist repo, which the
      # launcher polls via /releases/latest (with the user's read-only PAT).
      # Release builds only — a profile/debug dispatch never becomes an update the
      # launcher would install. The manifest is attached both inside the zip and
      # as its own asset so the launcher can read it without downloading the zip.
      # Cross-repo publish needs a PAT with Contents:write on couch-roach-dist,
      # stored as the DIST_REPO_TOKEN secret (the default GITHUB_TOKEN can't reach
      # another repo). Sidecars publish to the same dist repo — see the
      # "Launcher & sidecars" workflow.
      - name: Publish Release
        if: ${{ env.BUILD_MODE == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: BrianLandes/couch-roach-dist
          token: ${{ secrets.DIST_REPO_TOKEN }}
          tag_name: build-${{ github.run_number }}
          name: Couch Roach build ${{ github.run_number }} (v${{ env.APP_VERSION }})
          make_latest: true
          files: |
            ${{ env.ZIP_PATH }}
            ${{ env.OUT_DIR }}/manifest.json
