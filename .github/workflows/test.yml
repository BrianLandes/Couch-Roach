# Runs the Flutter test suite on every push to main and on pull requests. The
# suite is pure-Dart/drift (in-memory NativeDatabase) with no network or API
# keys, so it runs on cheap Linux runners — no Windows toolchain or
# dart_define.json needed. This is the green gate the build workflows assume.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Coalesce rapid pushes: a newer commit cancels an in-flight test run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.5"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Codegen (drift / injectable / json_serializable). Generated files ARE
      # committed, so this is normally a no-op that rewrites them identically —
      # it's here so a commit that adds a model or an annotated service builds
      # even when its *.g.dart hasn't been generated yet. --delete-conflicting-
      # outputs is required because the committed outputs already exist.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Surfaces drift between the committed generated files and what codegen
      # actually produces. A warning, not a failure: the build above already
      # used fresh output, and failing here would just block the commit that
      # introduced the model.
      - name: Check generated files are in sync
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain '*.g.dart' '*.config.dart')" ]]; then
            echo "::warning::Committed generated files differ from codegen output."
            git status --porcelain '*.g.dart' '*.config.dart'
            echo "Run: dart run build_runner build --delete-conflicting-outputs"
          else
            echo "Generated files are in sync."
          fi

      # Catches errors anywhere under lib/, including files no test imports.
      # --no-fatal-infos so style lints don't gate the build; errors and
      # warnings still do.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test
