name: Launcher & sidecars

# Manual trigger only — Actions tab → "Launcher & sidecars" → Run workflow.
# These are the rarely-changing "provisioning" assets, kept off the app build's
# hot path:
#   • the launcher (couch_roach_launcher.exe) — install once, self-updates the app
#   • the sidecars bundle (qBittorrent/yt-dlp/ffprobe/Jackett) — the launcher
#     provisions it into %LOCALAPPDATA%\CouchRoach\bin at runtime
# Run this when the launcher code changes or a sidecar version is bumped. The app
# build no longer rebuilds either, so app builds stay fast.

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.5"

jobs:
  launcher:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build launcher (release)
        working-directory: launcher
        run: |
          flutter pub get
          flutter build windows --release

      - name: Zip the launcher bundle
        shell: pwsh
        run: |
          $zip = "couch-roach-launcher-build${{ github.run_number }}.zip"
          Compress-Archive -Path "launcher/build/windows/x64/runner/Release/*" -DestinationPath $zip -Force
          "LAUNCHER_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: couch-roach-launcher
          path: ${{ env.LAUNCHER_ZIP }}
          if-no-files-found: error

  # Vendor the four sidecars, bundle them, and publish to a dedicated `sidecars`
  # PRERELEASE on the PRIVATE couch-roach-dist repo (same repo the launcher reads
  # app builds from — it fetches sidecars from the same config.repo). Prerelease
  # so it never becomes releases/latest (which would break the launcher's
  # app-build detection). The launcher fetches this by tag with the user's PAT.
  sidecars:
    runs-on: windows-latest
    # Publishes to another repo via DIST_REPO_TOKEN, not this one.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 7-Zip (preinstalled on windows-latest) is needed to extract qbittorrent.exe
      # from the NSIS installer.
      - name: Vendor qBittorrent daemon
        shell: pwsh
        run: ./tool/fetch_qbittorrent_windows.ps1

      - name: Vendor yt-dlp
        shell: pwsh
        run: ./tool/fetch_ytdlp_windows.ps1

      - name: Vendor ffprobe
        shell: pwsh
        run: ./tool/fetch_ffprobe_windows.ps1

      - name: Vendor Jackett
        shell: pwsh
        run: ./tool/fetch_jackett_windows.ps1

      # Assemble a flat bin layout (qbittorrent.exe, yt-dlp.exe, ffprobe.exe,
      # ffmpeg.exe, jackett/) and name the zip by a content hash of the five
      # binaries — so the launcher only re-downloads when a sidecar changes.
      - name: Package sidecars
        shell: pwsh
        run: |
          $stage = "sidecars_stage"
          New-Item -ItemType Directory -Force -Path $stage, "$stage/jackett" | Out-Null
          Copy-Item third_party/qbittorrent/win-x64/qbittorrent.exe $stage/
          Copy-Item third_party/yt-dlp/win-x64/yt-dlp.exe $stage/
          Copy-Item third_party/ffprobe/win-x64/ffprobe.exe $stage/
          Copy-Item third_party/ffprobe/win-x64/ffmpeg.exe $stage/
          Copy-Item third_party/jackett/win-x64/* "$stage/jackett/" -Recurse -Force
          Copy-Item third_party/qbittorrent/LICENSE-qbittorrent.txt $stage/ -ErrorAction SilentlyContinue
          Copy-Item third_party/yt-dlp/LICENSE-yt-dlp.txt $stage/ -ErrorAction SilentlyContinue
          Copy-Item third_party/ffprobe/LICENSE-ffmpeg.txt $stage/ -ErrorAction SilentlyContinue
          Copy-Item third_party/jackett/LICENSE-jackett.txt $stage/ -ErrorAction SilentlyContinue

          $parts = @(
            (Get-FileHash "$stage/qbittorrent.exe").Hash,
            (Get-FileHash "$stage/yt-dlp.exe").Hash,
            (Get-FileHash "$stage/ffprobe.exe").Hash,
            (Get-FileHash "$stage/ffmpeg.exe").Hash,
            (Get-FileHash "$stage/jackett/JackettConsole.exe").Hash
          ) -join ''
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($parts)
          $tag = (($sha.ComputeHash($bytes) | ForEach-Object { $_.ToString('x2') }) -join '').Substring(0, 8)

          $zip = "sidecars-$tag.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          "SIDECARS_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Sidecars asset: $zip"

      # Clear the previous `sidecars` release + tag on the dist repo first so the
      # release carries exactly one sidecars-*.zip (no stale assets accumulating
      # across bumps).
      - name: Clear previous sidecars release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: gh release delete sidecars --repo BrianLandes/couch-roach-dist --yes --cleanup-tag || true

      - name: Publish sidecars prerelease
        uses: softprops/action-gh-release@v2
        with:
          repository: BrianLandes/couch-roach-dist
          token: ${{ secrets.DIST_REPO_TOKEN }}
          tag_name: sidecars
          name: Sidecars bundle
          prerelease: true
          make_latest: false
          files: ${{ env.SIDECARS_ZIP }}
