name: couch_roach
description: "Home Media Center — a single-machine, one-click desktop media shell."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# NOTE: version constraints are starting points — run `flutter pub get` and
# bump anything the resolver complains about. See README.md → Setup.
dependencies:
  flutter:
    sdk: flutter

  # Playback — libmpv embedded in-process (see HANDOFF §4.5).
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.5

  # Local store — SQLite via drift (see DECISIONS: local store).
  # Pinned <2.32.0: drift_dev 2.32.1–2.34.0 have a codegen bug (call a sqlparser
  # API that isn't present), and the 2.34.2 fix needs analyzer 13, which
  # conflicts with injectable_generator (analyzer <11). Staying <2.32 keeps the
  # whole codegen toolchain in one coherent analyzer world. Revisit once
  # injectable_generator supports analyzer 13.
  drift: ">=2.20.0 <2.32.0"
  sqlite3_flutter_libs: ^0.5.20

  # Filesystem / paths.
  path: ^1.9.0
  path_provider: ^2.1.3

  # HTTP for TMDB + OpenSubtitles (Dart-only, no extra process).
  http: ^1.2.1

  # Dependency injection — services/singletons register via injectable
  # annotations; resolved through get_it. Container in lib/injection.dart.
  get_it: ^8.0.0
  injectable: ">=2.4.0 <2.13.0"

  # JSON serialization for API DTOs (TMDB / OpenSubtitles).
  json_annotation: ^4.9.0

  # UI state.
  flutter_riverpod: ^2.6.1

  # Navigation.
  go_router: ^14.6.0

  # Desktop window control (fullscreen / kiosk launch).
  window_manager: ^0.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Codegen — run: `dart run build_runner build`
  drift_dev: ">=2.20.0 <2.32.0" # keep matched to drift (see note above)
  injectable_generator: ">=2.4.0 <2.13.0"
  json_serializable: ">=6.7.0 <6.15.0"
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
